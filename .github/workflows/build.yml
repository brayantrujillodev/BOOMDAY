name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # google-services.json no está versionado (ver .gitignore y README →
      # "Setup para desarrolladores"). El plugin de Google Services solo
      # necesita un JSON bien formado con el package_name correcto para
      # generar código en tiempo de compilación — no valida contra Firebase
      # en el build, así que un archivo dummy alcanza para que CI compile
      # sin exponer ni depender de credenciales reales.
      - name: Generar google-services.json dummy para CI
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "boomday-ci-dummy",
              "storage_bucket": "boomday-ci-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.negociodigital.boomday"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "dummy-ci-api-key" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: assembleDebug
        run: ./gradlew assembleDebug --stacktrace
